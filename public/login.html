<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso Administrativo | Obra Blanca & Acabados</title>
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Estilos del Admin y Tailwind CSS Compilado -->
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="bg-dark-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 relative overflow-hidden selection:bg-brand-500 selection:text-dark-950">

    <!-- Efecto ambiental de luz arquitectónica (Glow de fondo) -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-brand-500/10 rounded-full blur-[140px] pointer-events-none"></div>
    <div class="absolute bottom-10 right-10 w-[350px] h-[350px] bg-sky-500/5 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Contenedor Principal de la Tarjeta de Login -->
    <div class="relative w-full max-w-md z-10">
        
        <!-- Tarjeta Central de Cristal Oscuro -->
        <div class="bg-dark-900/90 border border-slate-800 rounded-3xl p-6 sm:p-10 shadow-2xl backdrop-blur-2xl">
            
            <!-- Logo & Cabecera -->
            <div class="text-center mb-8">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-400 via-brand-500 to-amber-700 flex items-center justify-center font-display font-black text-dark-950 text-2xl shadow-xl shadow-brand-500/25 mx-auto mb-4 hover:scale-105 transition-transform duration-300">
                    OB
                </div>
                <h1 class="font-display font-extrabold text-2xl sm:text-3xl text-white tracking-tight">
                    Control Central
                </h1>
                <p class="text-xs sm:text-sm text-slate-400 mt-1">
                    Acceso Administrativo • Pipeline & CRM de Obras
                </p>
            </div>

            <!-- Banner de Alerta de Error (Oculto por defecto) -->
            <div id="loginAlert" class="hidden mb-6 p-3.5 rounded-2xl bg-rose-500/15 border border-rose-500/30 text-rose-300 text-xs font-semibold flex items-center gap-2.5 transition-all">
                <svg class="w-5 h-5 shrink-0 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span id="loginAlertText">Usuario o contraseña incorrectos.</span>
            </div>

            <!-- Formulario de Autenticación -->
            <form id="loginForm" class="space-y-5">
                
                <!-- Campo Usuario / Correo -->
                <div>
                    <label for="usernameInput" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                        Usuario o Correo
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" id="usernameInput" required autofocus
                               class="w-full pl-10 pr-4 py-3 rounded-xl bg-dark-950 border border-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all"
                               placeholder="admin@obrablanca.com">
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div>
                    <label for="passwordInput" class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-2">
                        Contraseña
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input type="password" id="passwordInput" required
                               class="w-full pl-10 pr-11 py-3 rounded-xl bg-dark-950 border border-slate-800 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all"
                               placeholder="••••••••••••">
                        <button type="button" id="btnTogglePassword" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200">
                            <svg id="eyeIcon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Recordar Sesión & Seguridad -->
                <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="rememberMe" checked class="w-4 h-4 rounded bg-dark-950 border-slate-700 text-brand-500 focus:ring-brand-500">
                        <span>Recordar en este equipo</span>
                    </label>
                    <span class="text-[11px] text-slate-500 font-mono">SSL 256-bit</span>
                </div>

                <!-- Botón de Ingreso Elegante -->
                <button type="submit" id="btnSubmitLogin"
                        class="w-full py-3.5 px-4 rounded-xl text-xs sm:text-sm font-bold text-dark-950 bg-gradient-to-r from-brand-400 via-brand-500 to-amber-500 hover:from-brand-300 hover:to-brand-400 shadow-lg shadow-brand-500/25 active:scale-95 transition-all flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                    </svg>
                    <span>Ingresar al Sistema</span>
                </button>

            </form>

            <!-- Enlace Volver a la Web Pública -->
            <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
                <a href="/" class="text-xs text-slate-400 hover:text-brand-400 transition-colors inline-flex items-center gap-1.5 font-medium">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    <span>Volver a la página web principal</span>
                </a>
            </div>

        </div>

        <!-- Indicador de Marca & Copyright -->
        <p class="text-center text-[11px] text-slate-600 mt-6 font-medium">
            Obra Blanca & Acabados Arquitectónicos • Plataforma Segura
        </p>

    </div>

    <!-- Script de Autenticación -->
    <script src="/js/login.js"></script>
</body>
</html>
